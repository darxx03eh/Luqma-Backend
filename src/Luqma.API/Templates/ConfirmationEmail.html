<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Confirmation - Luqma Restaurant</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #ffffff;">

    <table role="presentation" style="width: 100%; border-collapse: collapse; min-height: 100vh; background-color: #ffffff;">
        <tr>
            <td style="padding: 40px 20px; vertical-align: middle;">

                <table role="presentation"
                       style="max-width: 520px; margin: 0 auto; background-color: #ffffff;
                       border-radius: 18px; border: 1px solid #f1f1f1;
                       box-shadow: 0 8px 28px rgba(0,0,0,0.06); overflow: hidden;">

                    <tr>
                        <td style="
                            background: linear-gradient(135deg, #b60000 0%, #b30000 100%);
                            padding: 35px 40px;
                            text-align: center;
                        ">
                            <h1 style="
                                margin: 0;
                                color: #ffffff;
                                font-size: 28px;
                                font-weight: 700;
                                letter-spacing: 0.5px;
                                text-transform: uppercase;
                            ">
                                Confirm Your Email
                            </h1>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding: 35px 40px; text-align: center;">
                            <p style="margin: 0 0 22px 0; color: #4a5568; font-size: 16px; line-height: 1.6;">
                                Welcome to <strong style="color: #b60000;">Luqma Restaurant</strong>!
                                Please confirm your email to activate your account.
                            </p>

                            <table role="presentation" style="margin: 30px auto;">
                                <tr>
                                    <td>
                                        <a href="{linkOrCode}"
                                           style="
                                                display: inline-block;
                                                padding: 16px 42px;
                                                background: linear-gradient(135deg, #d60000 0%, #b30000 100%);
                                                color: #ffffff;
                                                text-decoration: none;
                                                border-radius: 50px;
                                                font-size: 15px;
                                                font-weight: 600;
                                                letter-spacing: 0.6px;
                                                box-shadow: 0 6px 20px rgba(214, 0, 0, 0.4);
                                                text-transform: uppercase;
                                                transition: 0.3s ease;
                                           ">
                                            Confirm Email
                                        </a>
                                    </td>
                                </tr>
                            </table>

                            <p style="margin: 25px 0 8px 0; color: #718096; font-size: 14px;">
                                If the button doesn't work, use the link below:
                            </p>
                            <p style="margin: 10px 0 0 0; word-break: break-all; color: #d60000; font-size: 14px;">
                                {linkOrCode}
                            </p>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding: 25px 40px; background: #b40000; text-align: center; color: #ffffff;">

                            <p style="margin: 0 0 6px 0; font-size: 15px; font-weight: 700;">
                                Luqma Restaurant
                            </p>

                            <p style="margin: 0; color: #ffe0e0; font-size: 12px; line-height: 1.4;">
                                Serving Quality • Taste You Remember
                            </p>

                            <hr style="margin: 18px auto; width: 80%; border: 0; border-top: 1px solid rgba(255,255,255,0.25);" />

                            <p style="margin: 0; color: #ffdddd; font-size: 11px;">
                                © {year} Luqma Restaurant — All Rights Reserved
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
