<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Your Email - Luqma Restaurant</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) ; min-height: 100vh;">
    <table role="presentation" style="width: 100%; border-collapse: collapse; min-height: 100vh;">
        <tr>
            <td style="padding: 40px 20px; vertical-align: middle;">
                <!-- Main Container -->
                <table role="presentation" style="max-width: 500px; margin: 0 auto; background-color: #ffffff; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); border-collapse: collapse; overflow: hidden;">

                    <!-- Email Icon and Title -->
                    <tr>
                        <td style="padding: 0 40px 30px 40px; text-align: center;">
                            <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 50%; margin: 0 auto 25px auto; display: flex; align-items: center; justify-content: center; position: relative;">
                                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color: white;">
                                    <path d="M4 4H20C21.1 4 22 4.9 22 6V18C22 19.1 21.1 20 20 20H4C2.9 20 2 19.1 2 18V6C2 4.9 2.9 4 4 4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                    <polyline points="22,6 12,13 2,6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </div>
                            <h1 style="margin: 0 0 15px 0; color: #2d3748; font-size: 28px; font-weight: 700; letter-spacing: -0.5px;">Email Confirmation</h1>
                        </td>
                    </tr>

                    <!-- Main Content -->
                    <tr>
                        <td style="padding: 0 40px 40px 40px; text-align: center;">
                            <p style="margin: 0 0 25px 0; color: #4a5568; font-size: 16px; line-height: 1.6;">
                                Hello! Thank you for joining us to <strong style="color: #2d3748;">Luqma Restaurant</strong>. Please confirm your email by pressing the button below.
                            </p>

                            <!-- Confirmation Button -->
                            <table role="presentation" style="margin: 35px auto; border-collapse: collapse;">
                                <tr>
                                    <td style="text-align: center;">
                                        <a href="{linkOrCode}" style="display: inline-block; padding: 18px 40px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #ffffff; text-decoration: none; border-radius: 50px; font-weight: 600; font-size: 16px; letter-spacing: 0.5px; box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4); transition: all 0.3s ease; text-transform: uppercase;">
                                          Confirm Your Email  
                                        </a>
                                    </td>
                                </tr>
                            </table>

                            <!-- Alternative Link -->
                            <p style="margin: 30px 0 0 0; color: #718096; font-size: 14px; line-height: 1.5;">
                                Or click the link below if the button doesn't work:
                            </p>
                            <p style="margin: 10px 0 0 0; word-break: break-all; color: #667eea; font-size: 14px;">
                                {linkOrCode}
                            </p>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding: 30px 40px; background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%); text-align: center;">
                            <!-- Social Media Icons -->
                            <div style="margin-bottom: 20px;">
                                <a href="#" style="display: inline-block; margin: 0 8px; width: 40px; height: 40px; background-color: rgba(255,255,255,0.1); border-radius: 50%; text-align: center; line-height: 40px; text-decoration: none; transition: all 0.3s ease;">
                                    <span style="color: #ffffff; font-size: 18px;">f</span>
                                </a>
                                <a href="#" style="display: inline-block; margin: 0 8px; width: 40px; height: 40px; background-color: rgba(255,255,255,0.1); border-radius: 50%; text-align: center; line-height: 40px; text-decoration: none; transition: all 0.3s ease;">
                                    <span style="color: #ffffff; font-size: 18px;">t</span>
                                </a>
                                <a href="#" style="display: inline-block; margin: 0 8px; width: 40px; height: 40px; background-color: rgba(255,255,255,0.1); border-radius: 50%; text-align: center; line-height: 40px; text-decoration: none; transition: all 0.3s ease;">
                                    <span style="color: #ffffff; font-size: 18px;">@</span>
                                </a>
                            </div>

                            <p style="margin: 0 0 10px 0; color: #ffffff; font-size: 16px; font-weight: 600;">
                                Luqma Restaurant
                            </p>
                            <p style="margin: 0; color: #a0aec0; font-size: 12px;">
                                Copyright © {year} Luqma Restaurant. All Rights Reserved
                            </p>
                        </td>
                    </tr>
                </table>

                <!-- Decorative Elements -->
                <div style="position: absolute; top: 10%; left: 10%; width: 20px; height: 20px; background-color: rgba(255,255,255,0.1); border-radius: 50%; animation: float 6s ease-in-out infinite;"></div>
                <div style="position: absolute; top: 20%; right: 15%; width: 15px; height: 15px; background-color: rgba(255,255,255,0.1); border-radius: 50%; animation: float 8s ease-in-out infinite reverse;"></div>
                <div style="position: absolute; bottom: 30%; left: 20%; width: 25px; height: 25px; background-color: rgba(255,255,255,0.1); border-radius: 50%; animation: float 7s ease-in-out infinite;"></div>
                <div style="position: absolute; bottom: 15%; right: 10%; width: 18px; height: 18px; background-color: rgba(255,255,255,0.1); border-radius: 50%; animation: float 9s ease-in-out infinite reverse;"></div>
            </td>
        </tr>
    </table>

    <style>
        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }
        }
    </style>
</body>
</html>
